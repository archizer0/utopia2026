<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Racer - Desvie dos Obstáculos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a202c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 2rem;
            border-radius: 1rem;
            color: white;
            text-align: center;
            border: 2px solid #ef4444;
            min-width: 280px;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="text-2xl font-bold">Pontuação: <span id="score">0</span></div>
        <div class="text-sm opacity-80">Use as Setas ou Toque para mover</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOverScreen">
        <h2 class="text-4xl font-bold text-red-500 mb-4">FIM DE JOGO!</h2>
        <p class="text-xl mb-6">Sua pontuação: <span id="finalScore">0</span></p>
        <button onclick="resetGame()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full transition-all">
            Jogar Novamente
        </button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');

        // Configurações do Jogo
        const LANES = 3;
        let canvasWidth = 400;
        let canvasHeight = 600;
        let laneWidth = canvasWidth / LANES;
       
        let gameActive = true;
        let score = 0;
        let gameSpeed = 5;
        let frameCount = 0;

        // Propriedades do Jogador
        const player = {
            lane: 1,
            x: 0,
            y: 0,
            w: 50,
            h: 80,
            targetX: 0,
            color: '#3b82f6' // Azul
        };

        let obstacles = [];

        function initCanvas() {
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            player.y = canvasHeight - 120;
            updatePlayerPosition(true);
        }

        function updatePlayerPosition(instant = false) {
            player.targetX = (player.lane * laneWidth) + (laneWidth / 2) - (player.w / 2);
            if (instant) player.x = player.targetX;
        }

        class Obstacle {
            constructor() {
                this.lane = Math.floor(Math.random() * LANES);
                this.w = 50;
                this.h = 80;
                this.x = (this.lane * laneWidth) + (laneWidth / 2) - (this.w / 2);
                this.y = -100;
                this.color = `hsl(${Math.random() * 360}, 70%, 50%)`;
                this.passed = false;
            }

            update() {
                this.y += gameSpeed;
            }

            draw() {
                // Desenha corpo do carro obstáculo
                ctx.fillStyle = this.color;
                ctx.roundRect(this.x, this.y, this.w, this.h, 10);
                ctx.fill();
               
                // Detalhes (janelas)
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(this.x + 5, this.y + 15, this.w - 10, 20);
               
                // Rodas
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x - 5, this.y + 10, 5, 20);
                ctx.fillRect(this.x + this.w, this.y + 10, 5, 20);
                ctx.fillRect(this.x - 5, this.y + 50, 5, 20);
                ctx.fillRect(this.x + this.w, this.y + 50, 5, 20);
            }
        }

        // Helper para desenhar retângulos arredondados (polyfill simples)
        if (!ctx.roundRect) {
            ctx.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            }
        }

        function drawRoad() {
            // Asfalto
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linhas divisórias
            ctx.setLineDash([40, 20]);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.lineDashOffset = -frameCount * gameSpeed;
           
            for (let i = 1; i < LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * laneWidth, 0);
                ctx.lineTo(i * laneWidth, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);
        }

        function drawPlayer() {
            // Suaviza movimento lateral
            const dx = player.targetX - player.x;
            player.x += dx * 0.2;

            // Corpo do carro do jogador
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'rgba(59, 130, 246, 0.5)';
            ctx.roundRect(player.x, player.y, player.w, player.h, 10);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Detalhes (janelas)
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.fillRect(player.x + 5, player.y + 20, player.w - 10, 15);
           
            // Faróis
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(player.x + 10, player.y + 5, 5, 0, Math.PI * 2);
            ctx.arc(player.x + player.w - 10, player.y + 5, 5, 0, Math.PI * 2);
            ctx.fill();

            // Rodas
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x - 5, player.y + 10, 5, 20);
            ctx.fillRect(player.x + player.w, player.y + 10, 5, 20);
            ctx.fillRect(player.x - 5, player.y + 50, 5, 20);
            ctx.fillRect(player.x + player.w, player.y + 50, 5, 20);
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.w &&
                   rect1.x + rect1.w > rect2.x &&
                   rect1.y < rect2.y + rect2.h &&
                   rect1.y + rect1.h > rect2.y;
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            drawRoad();

            // Gerar obstáculos
            if (frameCount % Math.max(20, Math.floor(60 - gameSpeed)) === 0) {
                obstacles.push(new Obstacle());
            }

            // Atualizar e desenhar obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.update();
                obs.draw();

                // Checar colisão (área de colisão levemente menor para ser justo)
                const collisionPadding = 5;
                const playerRect = {
                    x: player.x + collisionPadding,
                    y: player.y + collisionPadding,
                    w: player.w - collisionPadding * 2,
                    h: player.h - collisionPadding * 2
                };
               
                if (checkCollision(playerRect, obs)) {
                    endGame();
                }

                // Pontuação e limpeza
                if (obs.y > canvasHeight) {
                    if (!obs.passed) {
                        score += 10;
                        scoreElement.innerText = score;
                        gameSpeed += 0.05; // Aumenta dificuldade
                        obs.passed = true;
                    }
                    obstacles.splice(i, 1);
                }
            }

            drawPlayer();
            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameActive = false;
            finalScoreElement.innerText = score;
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            score = 0;
            gameSpeed = 5;
            obstacles = [];
            player.lane = 1;
            gameActive = true;
            scoreElement.innerText = '0';
            gameOverScreen.style.display = 'none';
            updatePlayerPosition(true);
            gameLoop();
        }

        // Controles
        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            if (e.key === 'ArrowLeft' && player.lane > 0) {
                player.lane--;
                updatePlayerPosition();
            } else if (e.key === 'ArrowRight' && player.lane < LANES - 1) {
                player.lane++;
                updatePlayerPosition();
            }
        });

        // Controles de Toque (dividir tela em duas áreas)
        canvas.addEventListener('touchstart', (e) => {
            if (!gameActive) return;
            const touchX = e.touches[0].clientX;
            const mid = window.innerWidth / 2;
           
            if (touchX < mid && player.lane > 0) {
                player.lane--;
            } else if (touchX > mid && player.lane < LANES - 1) {
                player.lane++;
            }
            updatePlayerPosition();
            e.preventDefault();
        }, { passive: false });

        // Inicialização
        window.onload = () => {
            initCanvas();
            gameLoop();
        };

        window.onresize = initCanvas;

    </script>
</body>
</html>
