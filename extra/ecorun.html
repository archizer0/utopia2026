<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Run: Sobrevivência Animal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
       
        body {
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }
       
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: transparent;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            z-index: 10;
        }

        .status-card {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.2);
            margin-bottom: 10px;
            min-width: 280px;
        }

        .bar-container {
            width: 100%;
            height: 14px;
            background: #1a1a1a;
            border-radius: 7px;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        #health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.2s ease;
        }

        .overlay {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.95);
            color: white;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            text-align: center;
        }

        .btn {
            background: #ff4757;
            color: #fff;
            padding: 18px 50px;
            border: none;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 25px;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }

        .btn:hover {
            background: #fff;
            color: #ff4757;
            transform: scale(1.1);
        }

        #diet-tag {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            margin-top: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Arco-íris para a vitória */
        .rainbow-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .rainbow {
            font-size: 80px;
        }
        .win-title {
            font-size: 70px;
            font-weight: 900;
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow-anim 2s linear infinite;
        }
        @keyframes rainbow-anim {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div class="status-card">
                <div class="flex justify-between font-black">
                    <span>VITALIDADE</span>
                    <span><span id="health-txt">100</span>%</span>
                </div>
                <div class="bar-container"><div id="health-bar"></div></div>
                <div id="diet-tag">Nível 1</div>
            </div>
            <div class="status-card">
                <div class="font-black text-xl">PONTUAÇÃO: <span id="score">0</span> pts</div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- Ecrã de Próximo Nível -->
        <div id="next-level" class="overlay">
            <h2 style="font-size: 30px; color: #aaa;">Nível Concluído!</h2>
            <h1 id="level-msg" style="font-size: 50px; font-weight: 900; margin: 10px 0;">Passaste de Nível</h1>
            <p id="next-animal-info" style="font-size: 20px;"></p>
            <button class="btn" onclick="startNextLevel()">Continuar Jornada</button>
        </div>

        <!-- Ecrã de Vitória -->
        <div id="win-screen" class="overlay">
            <div class="rainbow-container">
                <span class="rainbow">🌈</span>
                <h1 class="win-title">GANHASTE!</h1>
                <span class="rainbow">🌈</span>
            </div>
            <p style="font-size: 24px; margin-top: 20px;">Dominaste toda a cadeia alimentar!</p>
            <p style="font-size: 28px; font-weight: 900; margin-top: 10px;">Pontuação Final: <span id="win-score">0</span></p>
            <button class="btn" onclick="resetGame()">Jogar Novamente</button>
        </div>

        <!-- Ecrã de Game Over -->
        <div id="game-over" class="overlay">
            <h1 style="font-size: 55px; font-weight: 900; color: #ff4757;">CICLO ENCERRADO</h1>
            <p id="death-reason" style="font-size: 20px; color: #aaa; margin-top: 10px;"></p>
            <button class="btn" onclick="resetGame()">Tentar Novamente</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const healthBar = document.getElementById('health-bar');
    const healthTxt = document.getElementById('health-txt');
    const dietTag = document.getElementById('diet-tag');
    const scoreEl = document.getElementById('score');
   
    const nextLevelEl = document.getElementById('next-level');
    const winScreenEl = document.getElementById('win-screen');
    const gameOverEl = document.getElementById('game-over');
   
    const levelMsg = document.getElementById('level-msg');
    const nextAnimalInfo = document.getElementById('next-animal-info');
    const winScoreEl = document.getElementById('win-score');
    const deathReasonEl = document.getElementById('death-reason');

    // Configuração do Jogo
    let gameSpeed = 7;
    const GRAVITY = 0.8;
    const JUMP_FORCE = -17;
    let isRunning = false;
    let score = 0;
    let health = 100;
    let frameCount = 0;
    let currentLevel = 0;

    const player = {
        x: 120, y: 0, width: 90, height: 90, dy: 0, isJumping: false, groundY: 0
    };

    let foods = [];
    let obstacles = [];

    // Ordem dos Níveis
    const LEVEL_CONFIG = [
        { key: 'HERBIVORE', name: 'Nível 1: Herbívoro', color: '#2ecc71', type: 'plant', emoji: '🐘', goal: 1000 },
        { key: 'CARNIVORE', name: 'Nível 2: Carnívoro', color: '#e74c3c', type: 'meat', emoji: '🐺', goal: 2500 },
        { key: 'OMNIVORE', name: 'Nível Final: Omnívoro', color: '#f1c40f', type: 'both', emoji: '🐻', goal: 4500 }
    ];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = Math.min(window.innerHeight, 550);
        player.groundY = canvas.height - 140;
        if (!isRunning) player.y = player.groundY;
    }

    window.addEventListener('resize', resize);
    resize();

    function jump() {
        if (!player.isJumping && isRunning) {
            player.dy = JUMP_FORCE;
            player.isJumping = true;
        }
    }
    window.addEventListener('keydown', (e) => (e.code === 'Space' || e.code === 'ArrowUp') && jump());
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

    function initLevel() {
        const config = LEVEL_CONFIG[currentLevel];
        dietTag.innerText = config.name;
        dietTag.style.background = config.color;
        dietTag.style.color = config.key === 'OMNIVORE' ? '#000' : '#fff';
        health = 100;
        foods = [];
        obstacles = [];
    }

    function spawn() {
        if (frameCount % 45 === 0) {
            const isMeat = Math.random() > 0.5;
            const subType = isMeat ? (Math.random() > 0.5 ? '🥩' : '🐟') : (Math.random() > 0.5 ? '🍎' : '🍌');
            foods.push({
                x: canvas.width + 50,
                y: player.groundY - 20 - Math.random() * 200,
                type: isMeat ? 'meat' : 'plant',
                icon: subType,
                w: 50, h: 50
            });
        }
       
        if (frameCount % 90 === 0) {
            obstacles.push({
                x: canvas.width + 100,
                y: player.groundY + 30,
                w: 60, h: 60
            });
        }
    }

    function update() {
        if (!isRunning) return;
        frameCount++;
        score += 2;
        gameSpeed = 7 + (score / 1500);

        // Verificar Progressão de Nível
        if (score >= LEVEL_CONFIG[currentLevel].goal) {
            pauseForNextLevel();
            return;
        }

        player.dy += GRAVITY;
        player.y += player.dy;

        if (player.y >= player.groundY) {
            player.y = player.groundY;
            player.dy = 0;
            player.isJumping = false;
        }

        obstacles.forEach((obs, i) => {
            obs.x -= gameSpeed;
            if (player.x < obs.x + obs.w - 15 &&
                player.x + player.width > obs.x + 15 &&
                player.y < obs.y + obs.h - 15 &&
                player.y + player.height > obs.y + 15) {
                health -= 1.5;
            }
            if (obs.x < -100) obstacles.splice(i, 1);
        });

        foods.forEach((f, i) => {
            f.x -= gameSpeed;
            const dist = Math.hypot((player.x + 45) - (f.x + 25), (player.y + 45) - (f.y + 25));
            if (dist < 60) {
                const config = LEVEL_CONFIG[currentLevel];
                if (config.type === 'both' || config.type === f.type) {
                    health = Math.min(100, health + 20);
                } else {
                    health -= 25;
                }
                foods.splice(i, 1);
            }
            if (f.x < -100) foods.splice(i, 1);
        });

        spawn();
        health -= 0.08;

        if (health <= 0) endGame("Foste vencido pela fome ou má alimentação!");

        healthBar.style.width = health + "%";
        healthTxt.innerText = Math.ceil(health);
        scoreEl.innerText = Math.floor(score/10);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#5d4037';
        ctx.fillRect(0, canvas.height - 60, canvas.width, 60);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(0, canvas.height - 75, canvas.width, 15);

        ctx.fillStyle = '#2c3e50';
        obstacles.forEach(o => {
            ctx.beginPath();
            ctx.moveTo(o.x, o.y + o.h);
            ctx.lineTo(o.x + o.w / 2, o.y);
            ctx.lineTo(o.x + o.w, o.y + o.h);
            ctx.fill();
        });

        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        foods.forEach(f => {
            ctx.fillText(f.icon, f.x + 25, f.y + 35);
        });

        const config = LEVEL_CONFIG[currentLevel];
        ctx.fillStyle = config.color;
        ctx.shadowBlur = 20;
        ctx.shadowColor = config.color;
       
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.width, player.height, 15);
        ctx.fill();
        ctx.shadowBlur = 0;
       
        ctx.font = "60px Arial";
        ctx.fillText(config.emoji, player.x + 45, player.y + 65);

        if (isRunning) {
            update();
            requestAnimationFrame(draw);
        }
    }

    function pauseForNextLevel() {
        isRunning = false;
        if (currentLevel < LEVEL_CONFIG.length - 1) {
            currentLevel++;
            const next = LEVEL_CONFIG[currentLevel];
            nextAnimalInfo.innerText = `Próximo: ${next.emoji} ${next.key}`;
            nextLevelEl.style.display = 'flex';
        } else {
            winGame();
        }
    }

    function startNextLevel() {
        nextLevelEl.style.display = 'none';
        initLevel();
        isRunning = true;
        draw();
    }

    function winGame() {
        isRunning = false;
        winScreenEl.style.display = 'flex';
        winScoreEl.innerText = Math.floor(score/10);
    }

    function endGame(msg) {
        isRunning = false;
        gameOverEl.style.display = 'flex';
        deathReasonEl.innerText = msg;
    }

    function resetGame() {
        health = 100;
        score = 0;
        currentLevel = 0;
        frameCount = 0;
        isRunning = true;
        gameOverEl.style.display = 'none';
        winScreenEl.style.display = 'none';
        nextLevelEl.style.display = 'none';
        initLevel();
        draw();
    }

    // Iniciar
    initLevel();
    isRunning = true;
    draw();

</script>
</body>
</html>
